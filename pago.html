<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookeo · Finalizar pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:    #7db898;
  --g2:   #5a9a7a;
  --g3:   #e8f5ee;
  --g4:   #f0faf5;
  --dark: #1a1a2e;
  --text: #2e2e3a;
  --muted:#7a7a8a;
  --border:#e2dfd8;
  --cream:#faf8f3;
  --gold: #c9a84c;
  --white:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;padding-bottom:40px;}

.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;}
.topbar img{height:28px;}

.wrap{max-width:480px;margin:0 auto;padding:20px 18px;}
.titulo-pagina{font-family:'Lora',serif;font-size:1.1rem;color:var(--dark);margin-bottom:14px;text-align:center;}

.card{background:var(--white);border-radius:14px;padding:14px;box-shadow:0 3px 14px rgba(26,26,46,.05);margin-bottom:12px;}
.card-label{font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:9px;}

/* Resumen del pedido - una fila por libro */
.resumen-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
.resumen-row + .resumen-row{border-top:1px solid var(--border);}
.resumen-row-guardado{position:relative;}
.resumen-thumb{
  width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:var(--g3);box-shadow:0 2px 6px rgba(26,26,46,.1);
}
.resumen-info{flex:1;min-width:0;}
.resumen-titulo{font-family:'Lora',serif;font-size:0.86rem;color:var(--dark);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.resumen-meta{font-size:0.7rem;color:var(--muted);margin-top:1px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.enlace-ver-pdf{color:var(--g2);font-weight:700;text-decoration:none;}
.enlace-ver-pdf:hover{text-decoration:underline;}
.resumen-precio{font-size:0.86rem;font-weight:700;color:var(--dark);white-space:nowrap;}
.btn-quitar-libro{
  width:22px;height:22px;border-radius:50%;border:none;background:var(--g4);color:var(--muted);
  font-size:0.7rem;cursor:pointer;flex-shrink:0;margin-left:2px;
}
.btn-quitar-libro:hover{background:#fde2e2;color:#c0392b;}

.btn-otro-libro{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:10px;margin-top:4px;background:var(--g4);color:var(--g2);border:1.5px dashed var(--g);
  border-radius:12px;font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;
}
.btn-otro-libro:hover{background:var(--g3);}

/* Filas genéricas (envío, cantidad, total) */
.fila{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border);}
.fila:first-child{border-top:none;}
.fila-label{font-size:0.8rem;color:var(--text);}
.fila-hint{font-size:0.68rem;color:var(--g2);font-weight:600;margin-top:1px;}
.fila-valor{font-size:0.84rem;font-weight:700;color:var(--dark);}
.fila-valor.gratis{color:var(--g2);}
.fila-valor.tachado{text-decoration:line-through;color:var(--muted);font-weight:500;margin-right:6px;}

/* Selector de cantidad */
.cantidad-selector{display:flex;align-items:center;gap:10px;}
.cantidad-btn{
  width:28px;height:28px;border-radius:50%;border:none;background:var(--g3);color:var(--g2);
  font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.cantidad-btn:hover{background:var(--g4);}
.cantidad-btn:disabled{opacity:.35;cursor:not-allowed;}
.cantidad-num{font-size:0.9rem;font-weight:700;color:var(--dark);min-width:18px;text-align:center;}

/* Total */
.total-fila{display:flex;align-items:center;justify-content:space-between;padding-top:12px;margin-top:2px;border-top:2px solid var(--dark);}
.total-label{font-family:'Lora',serif;font-size:0.9rem;color:var(--dark);font-weight:700;}
.total-valor{font-family:'Lora',serif;font-size:1.15rem;color:var(--dark);font-weight:700;}

/* Botón descarga (temporal, mientras no hay pago) */
.btn-descarga{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 20px;background:var(--g2);color:var(--white);border:none;border-radius:50px;
  font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;text-decoration:none;
  box-shadow:0 4px 16px rgba(90,154,122,.28);transition:all .2s;
}
.btn-descarga:hover{background:var(--dark);}
.btn-descarga svg{width:17px;height:17px;flex-shrink:0;}
.nota-temporal{
  text-align:center;font-size:0.68rem;color:var(--muted);margin-top:8px;line-height:1.5;
}

/* Formulario de envío / factura */
.campo{margin-bottom:10px;}
.campo label{display:block;font-size:0.7rem;color:var(--muted);margin-bottom:4px;font-weight:600;}
.campo input, .campo select{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;
  font-family:inherit;font-size:0.84rem;color:var(--text);background:var(--white);
}
.campo input:focus, .campo select:focus{outline:none;border-color:var(--g);}
.fila-doble{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn-factura-toggle{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:none;padding:2px 0;font-family:inherit;
  font-size:0.86rem;font-weight:700;color:var(--dark);cursor:pointer;
}
.btn-factura-toggle .chevron{transition:transform .2s;color:var(--g2);font-size:1rem;}
.btn-factura-toggle.abierto .chevron{transform:rotate(180deg);}
.bloque-factura{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.bloque-factura.show{display:block;}
.check-misma-direccion{
  display:flex;align-items:center;gap:7px;font-size:0.76rem;color:var(--text);
  margin:2px 0 10px;cursor:pointer;
}

.fila-check{
  display:flex;align-items:flex-start;gap:8px;font-size:0.72rem;color:var(--muted);
  margin:4px 4px 14px;line-height:1.45;cursor:pointer;
}
.fila-check input{margin-top:2px;flex-shrink:0;}
.fila-check a{color:var(--g2);font-weight:600;text-decoration:none;}
.fila-check a:hover{text-decoration:underline;}
</style>
</head>

        <input type="email" id="envCorreo" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="envTelefono">Teléfono</label>
        <input type="tel" id="envTelefono" autocomplete="tel" required>
      </div>
    </div>
    <div class="campo">
      <label for="envDireccion">Dirección</label>
      <input type="text" id="envDireccion" autocomplete="street-address" required>
    </div>
    <div class="fila-doble">
      <div class="campo">
        <label for="envCiudad">Ciudad</label>
        <input type="text" id="envCiudad" autocomplete="address-level2" required>
      </div>
      <div class="campo">
        <label for="envCP">Código postal</label>
        <input type="text" id="envCP" inputmode="numeric" maxlength="5" autocomplete="postal-code" required>
      </div>
    </div>
    <div class="campo" style="margin-bottom:0;">
      <label for="envProvincia">Provincia</label>
      <select id="envProvincia" required></select>
    </div>
  </div>

  <div class="card">
    <button type="button" class="btn-factura-toggle" id="btnFacturaToggle">
      <span>🧾 ¿Quieres factura?</span>
      <span class="chevron">⌄</span>
    </button>
    <div class="bloque-factura" id="bloqueFactura">
      <div class="fila-doble">
        <div class="campo">
          <label for="facNif">NIF / CIF</label>
          <input type="text" id="facNif">
        </div>
        <div class="campo">
          <label for="facRazon">Razón social</label>
          <input type="text" id="facRazon">
        </div>
      </div>
      <label class="check-misma-direccion">
        <input type="checkbox" id="facMismaDireccion" checked>
        Usar la misma dirección de envío para la factura
      </label>
      <div id="bloqueFacturaDireccion" style="display:none;">
        <div class="campo">
          <label for="facDireccion">Dirección de facturación</label>
          <input type="text" id="facDireccion">
        </div>
        <div class="fila-doble">
          <div class="campo">
            <label for="facCiudad">Ciudad</label>
            <input type="text" id="facCiudad">
          </div>
          <div class="campo">
            <label for="facCP">Código postal</label>
            <input type="text" id="facCP" inputmode="numeric" maxlength="5">
          </div>
        </div>
        <div class="campo" style="margin-bottom:0;">
          <label for="facProvincia">Provincia</label>
          <select id="facProvincia"></select>
        </div>
      </div>
    </div>
  </div>

  <label class="fila-check">
    <input type="checkbox" id="checkRevisado" required>
    <span>He revisado el resultado de mi libro (botón "Ver completo" arriba) y estoy conforme.</span>
  </label>

  <button type="button" class="btn-descarga" id="btnContinuar">
    Continuar →
  </button>
</div>

<script>
const params = new URLSearchParams(location.search);
const BACKEND_URL = 'https://bookeo-production.up.railway.app';
const pedidoId = params.get('pedido_id') || '';
const pdfUrl = params.get('pdf_url') || '';
const titulo = params.get('titulo') || 'Mi álbum';
const portada = params.get('portada') || '';
const aw = parseFloat(params.get('aw')) || 208;
const ah = parseFloat(params.get('ah')) || 208;
const packsExtra = Math.max(0, parseInt(params.get('packs'), 10) || 0);
const desdeCero = params.get('desde_cero') === '1';
const tipoLibro = params.get('tipo_libro') || '';

const PRECIO_ENVIO = 2.90;

// Varios libros en un mismo pedido: cada libro que el cliente ya terminó y
// mandó a "Crear otro libro" se guarda aquí (en el propio navegador, con
// su PDF y su precio) hasta que llega el momento de pagar - ahí es cuando
// se juntan TODOS los PDF guardados + el que se esté viendo ahora mismo
// para mandarlos todos juntos a imprimir. Como el pago de verdad
// (Stripe) todavía no está construido, de momento esto se queda en el
// navegador del cliente; cuando se conecte el pago real, esta misma
// lista es la que hay que mandar al backend.
const CARRITO_KEY = 'bookeo_carrito_libros';

function leerCarrito() {
  try { return JSON.parse(localStorage.getItem(CARRITO_KEY) || '[]'); } catch (e) { return []; }
}
function guardarCarrito(lista) {
  localStorage.setItem(CARRITO_KEY, JSON.stringify(lista));
}
let carrito = leerCarrito();

function inferirFormato(aw, ah) {
  const clave = [Math.round(aw), Math.round(ah)].sort((a, b) => a - b).join('x');
  // Mismos precios de pack que en la landing (principal.html) - si
  // cambian ahí, hay que cambiarlos aquí también.
  const tabla = {
    '208x208': { etiqueta: '20×20 cm', precio: 26.90, packPrice: 0.50 },
    '218x288': { etiqueta: '21×28 cm', precio: 32.60, packPrice: 0.60 },
    '288x288': { etiqueta: '28×28 cm', precio: 46.50, packPrice: 0.80 },
  };
  return tabla[clave] || { etiqueta: `${Math.round(aw)}×${Math.round(ah)} mm`, precio: 26.90, packPrice: 0.60 };
}

let cantidad = 1; // ejemplares del libro ACTUAL (el que se está revisando ahora)
let totalPedidoActual = 0; // se recalcula en cada actualizar(), lo lee la página de confirmación

function formatearEuros(valor) {
  return valor.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function precioLibro(libro) {
  const f = inferirFormato(libro.aw, libro.ah);
  const costeExtra = (libro.packs || 0) * f.packPrice;
  return { etiqueta: f.etiqueta, unidad: f.precio + costeExtra };
}

function filaLibroHTML(libro, esActual, idx) {
  const info = precioLibro(libro);
  const cant = libro.cantidad || 1;
  return `
    <div class="resumen-row${esActual ? '' : ' resumen-row-guardado'}">
      <img class="resumen-thumb" src="${libro.portada || ''}" alt="Portada">
      <div class="resumen-info">
        <div class="resumen-titulo">${libro.titulo || 'Mi álbum'}</div>
        <div class="resumen-meta">
          <span>${cant} ${cant === 1 ? 'ejemplar' : 'ejemplares'}</span>
          <span>·</span>
          <span>${info.etiqueta}</span>
          ${libro.pdf_url ? `<span>·</span><a href="${libro.pdf_url}" target="_blank" class="enlace-ver-pdf">👁 Ver completo</a>` : ''}
        </div>
      </div>
      <div class="resumen-precio">${formatearEuros(info.unidad * cant)}</div>
      ${esActual ? '' : `<button type="button" class="btn-quitar-libro" data-idx="${idx}" title="Quitar">✕</button>`}
    </div>`;
}

function actualizar() {
  const libroActual = { titulo, portada, aw, ah, packs: packsExtra, cantidad, pdf_url: pdfUrl, pedido_id: pedidoId, desde_cero: desdeCero, tipo_libro: tipoLibro };

  const listaEl = document.getElementById('listaLibros');
  listaEl.innerHTML = carrito.map((l, i) => filaLibroHTML(l, false, i)).join('')
    + filaLibroHTML(libroActual, true);

  let totalLibrosFisicos = cantidad;
  let subtotal = precioLibro(libroActual).unidad * cantidad;
  carrito.forEach((l) => {
    totalLibrosFisicos += (l.cantidad || 1);
    subtotal += precioLibro(l).unidad * (l.cantidad || 1);
  });

  document.getElementById('cantidadNum').textContent = cantidad;
  document.getElementById('btnMenos').disabled = cantidad <= 1;

  const envioGratis = totalLibrosFisicos >= 2;
  const envioValorEl = document.getElementById('envioValor');
  envioValorEl.innerHTML = envioGratis
    ? `<span class="fila-valor tachado">${formatearEuros(PRECIO_ENVIO)}</span><span class="gratis">Gratis</span>`
    : formatearEuros(PRECIO_ENVIO);
  document.getElementById('envioHint').textContent = envioGratis
    ? '¡Envío gratis aplicado!'
    : 'Gratis a partir de 2 libros (de todo el pedido)';

  const costeExtraPorLibro = packsExtra * inferirFormato(aw, ah).packPrice;
  if (packsExtra > 0) {
    document.getElementById('filaPaginasExtra').style.display = 'flex';
    document.getElementById('paginasExtraHint').textContent = `+${packsExtra * 2} páginas añadidas en el editor (este libro)`;
    document.getElementById('paginasExtraValor').textContent = formatearEuros(costeExtraPorLibro * cantidad);
  }

  const envio = envioGratis ? 0 : PRECIO_ENVIO;
  const total = subtotal + envio;
  document.getElementById('totalValor').textContent = formatearEuros(total);
  totalPedidoActual = total;
}

document.getElementById('btnMas').onclick = () => { cantidad++; actualizar(); };
document.getElementById('btnMenos').onclick = () => { if (cantidad > 1) { cantidad--; actualizar(); } };

// Quitar un libro ya guardado del pedido (el actual no se puede quitar
// desde aquí - para eso ya está "Volver a editar" en el propio editor).
document.getElementById('listaLibros').addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-quitar-libro');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  carrito.splice(idx, 1);
  guardarCarrito(carrito);
  actualizar();
});

// Guarda el libro actual (con su PDF y su precio) en el pedido, y manda
// al cliente a crear uno nuevo - al volver aquí para pagar, se verán
// todos juntos y se sumará el total de verdad.
document.getElementById('btnOtroLibro').onclick = () => {
  carrito.push({ titulo, portada, aw, ah, packs: packsExtra, cantidad, pdf_url: pdfUrl, pedido_id: pedidoId, desde_cero: desdeCero, tipo_libro: tipoLibro });
  guardarCarrito(carrito);
  window.location.href = 'creador.html?desde_carrito=1';
};

actualizar();

// ── FORMULARIO DE ENVÍO / FACTURA ──
const PROVINCIAS = [
  'A Coruña','Álava','Albacete','Alicante','Almería','Asturias','Ávila','Badajoz',
  'Barcelona','Burgos','Cáceres','Cádiz','Cantabria','Castellón','Ceuta','Ciudad Real',
  'Córdoba','Cuenca','Girona','Granada','Guadalajara','Guipúzcoa','Huelva','Huesca',
  'Jaén','La Rioja','León','Lleida','Lugo','Madrid','Málaga','Melilla','Murcia',
  'Navarra','Ourense','Palencia','Pontevedra','Salamanca','Segovia','Sevilla','Soria',
  'Tarragona','Teruel','Toledo','Valencia','Valladolid','Vizcaya','Zamora','Zaragoza',
]; // sin Baleares ni Canarias, a propósito

function rellenarProvincias(idSelect) {
  const sel = document.getElementById(idSelect);
  sel.innerHTML = '<option value="">Selecciona...</option>' + PROVINCIAS.map((p) => `<option>${p}</option>`).join('');
}
rellenarProvincias('envProvincia');
rellenarProvincias('facProvincia');

// Toggle de factura
const btnFacturaToggle = document.getElementById('btnFacturaToggle');
const bloqueFactura = document.getElementById('bloqueFactura');
btnFacturaToggle.onclick = () => {
  const abierto = bloqueFactura.classList.toggle('show');
  btnFacturaToggle.classList.toggle('abierto', abierto);
};

// Dirección de facturación: por defecto oculta (se usa la de envío);
// solo se muestra si el cliente marca que quiere una distinta.
const facMismaDireccion = document.getElementById('facMismaDireccion');
const bloqueFacturaDireccion = document.getElementById('bloqueFacturaDireccion');
facMismaDireccion.onchange = () => {
  bloqueFacturaDireccion.style.display = facMismaDireccion.checked ? 'none' : 'block';
};

function recogerDatosFormulario() {
  const quiereFactura = bloqueFactura.classList.contains('show')
    && (document.getElementById('facNif').value.trim() || document.getElementById('facRazon').value.trim());

  const datos = {
    pedido_id: pedidoId,
    nombre: document.getElementById('envNombre').value.trim(),
    correo: document.getElementById('envCorreo').value.trim(),
    telefono: document.getElementById('envTelefono').value.trim(),
    direccion: document.getElementById('envDireccion').value.trim(),
    ciudad: document.getElementById('envCiudad').value.trim(),
    codigo_postal: document.getElementById('envCP').value.trim(),
    provincia: document.getElementById('envProvincia').value,
    quiere_factura: !!quiereFactura,
  };

  if (quiereFactura) {
    datos.factura_nif = document.getElementById('facNif').value.trim();
    datos.factura_razon_social = document.getElementById('facRazon').value.trim();
    if (facMismaDireccion.checked) {
      datos.factura_direccion = datos.direccion;
      datos.factura_ciudad = datos.ciudad;
      datos.factura_codigo_postal = datos.codigo_postal;
      datos.factura_provincia = datos.provincia;
    } else {
      datos.factura_direccion = document.getElementById('facDireccion').value.trim();
      datos.factura_ciudad = document.getElementById('facCiudad').value.trim();
      datos.factura_codigo_postal = document.getElementById('facCP').value.trim();
      datos.factura_provincia = document.getElementById('facProvincia').value;
    }
  }

  return datos;
}

function formularioValido() {
  const camposObligatorios = ['envNombre', 'envCorreo', 'envTelefono', 'envDireccion', 'envCiudad', 'envCP', 'envProvincia'];
  for (const id of camposObligatorios) {
    if (!document.getElementById(id).value.trim()) return false;
  }
  if (!document.getElementById('checkRevisado').checked) return false;
  return true;
}

// Se guarda en Supabase solo el contacto del cliente (nombre/correo/
// teléfono) en cuanto esos tres campos están rellenos - la dirección de
// envío/facturación NO se guarda en Supabase, solo se usa (más adelante)
// para mandarla a Gelato al fabricar el pedido.
let contactoYaGuardado = false;
async function guardarDatosEnvioSiValido() {
  const nombre = document.getElementById('envNombre').value.trim();
  const correo = document.getElementById('envCorreo').value.trim();
  const telefono = document.getElementById('envTelefono').value.trim();
  if (contactoYaGuardado || !nombre || !correo || !telefono) return;
  try {
    await fetch(BACKEND_URL + '/crear-pedido/datos-contacto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correo, nombre, telefono }),
    });
    contactoYaGuardado = true;
  } catch (e) {
    console.error('No se pudieron guardar los datos de contacto:', e);
  }
}

// Se intenta guardar cada vez que el cliente sale de un campo del
// formulario (no en cada tecla, para no saturar) - así los datos quedan
// registrados aunque el cliente no llegue a pulsar ningún botón de pago
// todavía (que aún no existe de verdad en esta pantalla de prueba).
document.querySelectorAll('.card input, .card select').forEach((el) => {
  el.addEventListener('blur', guardarDatosEnvioSiValido);
});

// "Continuar" - guarda TODO (libros del pedido + datos de envío/factura)
// en localStorage y pasa a la página de confirmación final, que ya no
// permite añadir libros ni cambiar cantidades, solo revisar y pagar.
document.getElementById('btnContinuar').onclick = async () => {
  if (!formularioValido()) {
    toast_pago('⚠️ Rellena todos los datos de envío antes de continuar');
    return;
  }
  await guardarDatosEnvioSiValido();

  const libroActual = { titulo, portada, aw, ah, packs: packsExtra, cantidad, pdf_url: pdfUrl, pedido_id: pedidoId, desde_cero: desdeCero, tipo_libro: tipoLibro };
  const librosPedido = [...carrito, libroActual];

  localStorage.setItem('bookeo_pedido_confirmar', JSON.stringify({
    pedido_id: pedidoId,
    libros: librosPedido,
    envio: recogerDatosFormulario(),
    total: totalPedidoActual,
  }));

  window.location.href = 'confirmar-pedido.html';
};

// Pequeño aviso en pantalla (sin depender de ninguna librería) para el
// caso de "faltan datos" al pulsar Continuar.
function toast_pago(mensaje) {
  let el = document.getElementById('toastPago');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toastPago';
    el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:30px;font-size:0.8rem;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90%;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = mensaje;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
}
</script>
</body>
</html>
