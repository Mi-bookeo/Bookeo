<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8fc2a3">
<title>Panel Bookeo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#8fc2a3;
  --carbon:#403a3c;
  --amarillo:#dbd670;
  --rojo:#f0413c;
  --azul:#296ea9;
  --ok:#2f8f5b;
  --tarjeta:#f3f8f5;
  --linea:#d3e4da;
  --suave:#6b6467;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--verde);
  color:var(--carbon);
  min-height:100vh;
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
}
header{
  padding:calc(18px + env(safe-area-inset-top,0px)) 0 6px;
  display:flex;justify-content:center;
}
header img{display:block;width:94vw;max-width:720px;height:auto}
main{max-width:720px;margin:0 auto;padding:6px 14px 0}
section{background:var(--tarjeta);border-radius:14px;padding:16px;margin-top:12px}
h2{font-size:1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font-weight:400;color:var(--suave);font-size:.8rem}

/* servicios */
.servicios{display:flex;gap:8px;flex-wrap:wrap}
.servicio{flex:1 1 30%;min-width:96px;border:1.5px solid var(--linea);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem;background:#fff}
.punto{width:11px;height:11px;border-radius:50%;background:var(--suave);flex:none}
.servicio.ok .punto{background:var(--ok)}
.servicio.mal{border-color:var(--rojo)}
.servicio.mal .punto{background:var(--rojo)}
.servicio.mal span{color:var(--rojo)}

/* fallos */
.fallo{background:#fff;border-left:4px solid var(--rojo);border-radius:8px;padding:8px 10px;margin-top:8px}
.fallo:first-of-type{margin-top:0}
.fallo .d{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.9rem}
.fallo .d span:last-child{font-weight:400;color:var(--suave);font-size:.78rem;white-space:nowrap}
.fallo .m{font-size:.8rem;color:var(--suave);margin-top:2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sinfallos{color:var(--ok);font-weight:600;font-size:.9rem}

/* ventas */
.ventas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.venta{background:#fff;border-radius:10px;padding:10px 8px;border-top:4px solid var(--carbon);min-width:0;overflow:hidden}
.venta:nth-child(1){border-top-color:var(--amarillo)}
.venta:nth-child(2){border-top-color:var(--azul)}
.venta:nth-child(3){border-top-color:var(--rojo)}
.venta .n{font-size:clamp(1rem,4.8vw,1.5rem);white-space:nowrap;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.venta .t{font-size:.78rem;color:var(--suave);margin-top:4px}
.venta .p{font-size:.78rem;color:var(--carbon);margin-top:2px;font-variant-numeric:tabular-nums}

/* pedidos */
.pedido{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--linea)}
.pedido:first-child{border-top:0;padding-top:0}
.pedido .tit{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedido .pre{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.pedido .meta{font-size:.8rem;color:var(--suave)}
.estado{justify-self:end;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--linea);color:var(--carbon)}
.estado.pagado{background:#cfe9d9;color:#1f6b41}
.estado.pendiente{background:#f6efb8;color:#6b6320}
.estado.error{background:#fbd0ce;color:#a3221e}
.vacio{color:var(--suave);font-size:.9rem;padding:6px 0}

/* atajos */
.atajos{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.atajo{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--carbon);font-size:.7rem;width:54px}
.atajo b{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:.85rem;font-weight:800;color:#fff;background:var(--carbon)}
.atajo:nth-child(4n+1) b{background:var(--carbon)}
.atajo:nth-child(4n+2) b{background:var(--azul)}
.atajo:nth-child(4n+3) b{background:var(--rojo)}
.atajo:nth-child(4n+4) b{background:#a39c3a}
.atajo:focus-visible,.repetir:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--azul);outline-offset:2px;border-radius:8px}
.repetir{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:.82rem;font-weight:600;color:var(--carbon);text-decoration:none;border:1.5px solid var(--carbon);border-radius:99px;padding:5px 12px}

/* acceso y avisos */
.acceso{display:none}
.acceso.ver{display:block}
.acceso p{font-size:.9rem;margin-bottom:10px}
.acceso .fila{display:flex;gap:8px}
input{flex:1;font:inherit;padding:10px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--carbon);min-width:0}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:10px;background:var(--carbon);color:#fff;cursor:pointer}
button.claro{background:transparent;color:var(--carbon);border:1.5px solid var(--carbon);padding:4px 10px;font-size:.78rem}
.aviso{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.85rem;background:#f6efb8;color:#4d4712}
.aviso.ver{display:block}
.aviso.error{background:#fbd0ce;color:#7d1a17}
@media (prefers-reduced-motion:no-preference){
  .cargando .n{opacity:.35;transition:opacity .3s}
}
</style>
</head>

  REFRESCO_SEGUNDOS: 60,

  // Accesos rápidos: pon aquí el enlace directo a tu proyecto si quieres saltarte la portada
  ATAJOS: [
    { n: "GitHub",   s: "GH", u: "https://github.com" },
    { n: "Railway",  s: "Ra", u: "https://railway.com/dashboard" },
    { n: "Supabase", s: "Sb", u: "https://supabase.com/dashboard" },
    { n: "Stripe",   s: "St", u: "https://dashboard.stripe.com" },
    { n: "Gelato",   s: "Ge", u: "https://dashboard.gelato.com" },
    { n: "Resend",   s: "Re", u: "https://resend.com/emails" },
    { n: "Drive",    s: "Dr", u: "https://drive.google.com" },
    { n: "R2",       s: "R2", u: "https://dash.cloudflare.com/?to=/:account/r2/overview" }
  ]
};
/* =========================================================== */

const $ = id => document.getElementById(id);
const esModo = () => CONFIG.API_URL.includes("TU-BACKEND");
const euros0 = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n || 0);
const euros = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n || 0);

function leerClave(){ try { return localStorage.getItem("bk_admin") || ""; } catch(e){ return ""; } }
function guardarClave(v){ try { localStorage.setItem("bk_admin", v); } catch(e){} }
function borrarClave(){ try { localStorage.removeItem("bk_admin"); } catch(e){} }

function aviso(texto, tipo){
  const a = $("aviso");
  if(!texto){ a.className = "aviso"; a.textContent = ""; return; }
  a.className = "aviso ver" + (tipo === "error" ? " error" : "");
  a.textContent = texto;
}

const DEMO = {
  servicios: [
    { nombre: "Web", ok: true },
    { nombre: "Worker", ok: true },
    { nombre: "Beat", ok: true }
  ],
  fallos: [
    { cuando: "hoy 09:41", origen: "tarea", donde: "generar_libro", mensaje: "Ejemplo: no se pudo subir el PDF a R2" }
  ],
  ventas: {
    hoy:  { importe: 59.5,   pedidos: 2 },
    mes:  { importe: 1284.7, pedidos: 41 },
    pendientes: { importe: 78.6, pedidos: 3 }
  },
  pedidos: [
    { numero: "1042", titulo: "Verano en Cádiz", precio: 32.6, estado: "pagado", fecha: "hoy 10:12" },
    { numero: "1041", titulo: "Nuestro primer año", precio: 26.9, estado: "pagado", fecha: "hoy 08:40" },
    { numero: "1040", titulo: "Bodas de plata", precio: 46.5, estado: "pendiente", fecha: "ayer" },
    { numero: "1039", titulo: "Viaje a Japón", precio: 32.1, estado: "pendiente", fecha: "ayer" }
  ]
};

function pintar(d){
  $("servicios").innerHTML = (d.servicios || []).map(s =>
    `<div class="servicio ${s.ok === true ? "ok" : s.ok === false ? "mal" : ""}" title="${s.ok === null ? "Sin datos todavía" : ""}"><i class="punto"></i><span>${esc(s.nombre)}</span></div>`
  ).join("") || '<p class="vacio">Sin datos de servicios.</p>';

  const fs = d.fallos || [];
  $("fallos").innerHTML = fs.length ? fs.map(f =>
    `<div class="fallo"><div class="d"><span>${f.origen === "web" ? "Web" : "Tarea"} · ${esc(f.donde)}</span><span>${esc(f.cuando)}</span></div><div class="m">${esc(f.mensaje)}</div></div>`
  ).join("") : '<p class="sinfallos">Sin fallos recientes ✓</p>';
  $("vaciar").style.display = fs.length ? "" : "none";

  const v = d.ventas || {};
  const bloque = (t, o) => `<div class="venta"><div class="n">${euros0(o && o.importe)}</div><div class="t">${t}</div><div class="p">${(o && o.pedidos) || 0} pedidos</div></div>`;
  $("ventas").innerHTML = bloque("Hoy", v.hoy) + bloque("Este mes", v.mes) + bloque("Sin pagar", v.pendientes);

  const ps = d.pedidos || [];
  $("pedidos").innerHTML = ps.length ? ps.map(p => {
    const est = String(p.estado || "").toLowerCase();
    const cls = est === "pagado" ? "pagado" : est === "pendiente" ? "pendiente" : (est === "error" || est === "fallido") ? "error" : "";
    return `<div class="pedido">
      <div class="tit">${esc(p.titulo)}</div><div class="pre">${euros(p.precio)}</div>
      <div class="meta">#${esc(p.numero)} · ${esc(p.fecha)}</div><span class="estado ${cls}">${esc(p.estado)}</span>
    </div>`;
  }).join("") : '<p class="vacio">Todavía no hay pedidos.</p>';

  const ahora = new Date();
  $("hora").textContent = "actualizado " + ahora.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
}

function esc(t){
  return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function cargar(){
  document.body.classList.add("cargando");
  try{
    if(esModo()){
      pintar(DEMO);
      aviso("Datos de ejemplo. Cuando pongas la URL de tu backend en CONFIG, verás los reales.");
      $("acceso").classList.remove("ver");
      return;
    }
    const clave = leerClave();
    if(!clave){ $("acceso").classList.add("ver"); return; }

    const r = await fetch(CONFIG.API_URL + CONFIG.API_RUTA, { headers: { "X-Admin-Key": clave } });
    if(r.status === 401 || r.status === 403){
      borrarClave();
      $("acceso").classList.add("ver");
      aviso("Clave incorrecta. Vuelve a escribirla.", "error");
      return;
    }
    if(!r.ok) throw new Error("HTTP " + r.status);
    pintar(await r.json());
    $("acceso").classList.remove("ver");
    aviso("");
  }catch(e){
    aviso("No se pudo conectar con el backend. Comprueba que la web de Railway está activa e inténtalo de nuevo.", "error");
  }finally{
    document.body.classList.remove("cargando");
  }
}

/* accesos y repetir pedido */
$("atajos").innerHTML = CONFIG.ATAJOS.map(a =>
  `<a class="atajo" href="${esc(a.u)}" target="_blank" rel="noopener"><b>${esc(a.s)}</b>${esc(a.n)}</a>`
).join("");
$("repetir").href = CONFIG.REPETIR_URL;

$("entrar").addEventListener("click", () => {
  const v = $("clave").value.trim();
  if(!v) return;
  guardarClave(v);
  $("clave").value = "";
  cargar();
});
$("clave").addEventListener("keydown", e => { if(e.key === "Enter") $("entrar").click(); });
$("actualizar").addEventListener("click", cargar);
$("vaciar").addEventListener("click", async () => {
  if(esModo()){ DEMO.fallos = []; pintar(DEMO); return; }
  try{
    await fetch(CONFIG.API_URL + CONFIG.API_RUTA + "/vaciar-fallos", { method: "POST", headers: { "X-Admin-Key": leerClave() } });
  }catch(e){}
  cargar();
});

cargar();
setInterval(() => { if(!document.hidden) cargar(); }, CONFIG.REFRESCO_SEGUNDOS * 1000);
</script>
</body>
</html>
