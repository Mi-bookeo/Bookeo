<style>
:root{
  --g:    #7db898;
  --g2:   #5a9a7a;
  --g3:   #e8f5ee;
  --g4:   #f0faf5;
  --dark: #1a1a2e;
  --text: #2e2e3a;
  --muted:#7a7a8a;
  --border:#e2dfd8;
  --cream:#faf8f3;
  --gold: #c9a84c;
  --white:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--text);}
button{font-family:inherit;}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── TOPBAR ── */
.topbar{
  flex-shrink:0;background:var(--white);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:9px 14px;
}
.topbar-logo{height:26px;width:auto;display:block;flex-shrink:0;}
.page-indicator{font-size:0.76rem;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.topbar-tools{
  display:flex;align-items:center;gap:6px;margin-left:auto;
  overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;
}
.topbar-tools::-webkit-scrollbar{display:none;}

.tool-btn{
  display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:50px;
  border:none;background:var(--g3);color:var(--g2);font-size:0.78rem;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.tool-btn:hover{background:var(--g4);}
.tool-btn:disabled{opacity:.35;cursor:not-allowed;}
.tool-btn.primary{background:var(--g2);color:var(--white);}
.tool-btn.primary:hover{background:var(--dark);}
.tool-btn svg{width:15px;height:15px;flex-shrink:0;}

/* ── CANVAS ── */
.canvas-area{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:auto;padding:18px;position:relative;background:var(--cream);
}
.canvas-shadow{
  background:var(--white);box-shadow:0 10px 34px rgba(26,26,46,.16);
  border-radius:4px;line-height:0;
}
.page-hint{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:var(--dark);color:var(--white);font-size:0.72rem;padding:6px 14px;
  border-radius:50px;opacity:.88;pointer-events:none;
}
.btn-eliminar-seleccion{
  position:absolute;top:14px;right:14px;display:none;align-items:center;gap:6px;
  background:#e05c5c;color:var(--white);border:none;border-radius:50px;
  padding:8px 14px;font-size:0.76rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(224,92,92,.35);z-index:60;font-family:inherit;
}
.btn-eliminar-seleccion.show{display:flex;}
.btn-eliminar-seleccion:hover{background:#c94848;}
.btn-ver-video{
  position:absolute;top:14px;right:150px;display:none;align-items:center;gap:6px;
  background:var(--g2);color:var(--white);border:none;border-radius:50px;
  padding:8px 14px;font-size:0.76rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(90,154,122,.35);z-index:60;font-family:inherit;
}
.btn-ver-video.show{display:flex;}
.btn-ver-video:hover{background:var(--dark);}
@media (max-width:720px){
  .btn-ver-video{right:auto;left:14px;}
}

/* ── BOTTOMBAR ── */
.bottombar{
  flex-shrink:0;background:var(--white);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  overflow-x:auto;scrollbar-width:none;
}
.bottombar::-webkit-scrollbar{display:none;}
.bottombar .tool-btn{
  flex-direction:column;gap:3px;font-size:0.63rem;padding:8px 15px;
  background:transparent;color:var(--text);border-radius:14px;
}
.bottombar .tool-btn svg{width:19px;height:19px;}
.bottombar .tool-btn:hover,.bottombar .tool-btn.active{background:var(--g3);color:var(--g2);}
.bottombar .tool-btn.primary{background:var(--g2);color:var(--white);}
.bottombar .tool-btn.primary:hover{background:var(--dark);}

/* ── PANEL LATERAL (PC) / DRAWER (MÓVIL) ── */
.panel-overlay{position:fixed;inset:0;background:rgba(26,26,46,.4);display:none;z-index:400;}
.panel-overlay.show{display:block;}
.panel{
  position:fixed;top:0;right:0;height:100%;width:300px;background:var(--white);
  box-shadow:-10px 0 34px rgba(26,26,46,.16);z-index:401;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.175,.885,.32,1.275);
  display:flex;flex-direction:column;
}
.panel.show{transform:translateX(0);}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.panel-header strong{font-family:'Lora',serif;font-size:1.02rem;color:var(--dark);}
.panel-close{
  width:32px;height:32px;border-radius:50%;border:none;background:var(--g3);
  color:var(--g2);font-size:1rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.panel-close:hover{background:var(--g4);}
.panel-tabs{display:flex;gap:6px;padding:12px 16px 0;flex-shrink:0;}
.panel-tab{
  flex:1;text-align:center;padding:8px 0;border-radius:50px;border:none;
  background:var(--g4);color:var(--muted);font-size:0.72rem;font-weight:700;cursor:pointer;
}
.panel-tab.active{background:var(--g2);color:var(--white);}
.panel-body{flex:1;overflow-y:auto;padding:14px 16px;}
.thumb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.thumb{
  position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;aspect-ratio:1;background:var(--g4);
}
.thumb.active{border-color:var(--g2);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .thumb-label{
  position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(26,26,46,.72));
  color:var(--white);font-size:0.62rem;font-weight:700;padding:12px 6px 5px;text-align:center;
}
.thumb .thumb-loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:0.68rem;}

@media (max-width:720px){
  .panel{top:auto;bottom:0;right:0;left:0;width:100%;height:68vh;border-radius:22px 22px 0 0;transform:translateY(100%);}
  .panel.show{transform:translateY(0);}
  .topbar-tools .tool-btn .label,.bottombar .tool-btn .label-full{display:none;}
  .bottombar .tool-btn{padding:8px 12px;}
}

/* ── LOADING ── */
.loading-overlay{
  position:fixed;inset:0;background:var(--cream);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .3s;
}
.loading-overlay.hide{opacity:0;pointer-events:none;}
.loading-overlay img{height:40px;margin-bottom:6px;}
.spinner{width:36px;height:36px;border:3px solid var(--g3);border-top-color:var(--g2);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:0.86rem;color:var(--muted);text-align:center;padding:0 30px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--dark);color:var(--white);border:1px solid var(--g);border-radius:50px;
  padding:11px 22px;font-size:0.82rem;max-width:88vw;text-align:center;
  transition:transform .35s cubic-bezier(.175,.885,.32,1.275);z-index:998;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── MODAL CONFIRMACIÓN ── */
.bk-modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,.55);display:none;align-items:center;justify-content:center;z-index:997;padding:24px;}
.bk-modal-overlay.show{display:flex;}
.bk-modal-box{background:var(--white);border-radius:20px;padding:28px 24px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(26,26,46,.25);}
.bk-modal-icon{font-size:2rem;margin-bottom:8px;}
.bk-modal-msg{color:var(--text);font-size:0.9rem;line-height:1.55;margin-bottom:20px;}
.bk-modal-actions{display:flex;gap:10px;justify-content:center;}
.bk-modal-btn{flex:1;padding:11px 16px;border-radius:50px;font-size:0.84rem;font-weight:700;border:none;cursor:pointer;}
.bk-modal-btn.cancelar{background:var(--g3);color:var(--g2);}
.bk-modal-btn.aceptar{background:var(--g2);color:var(--white);}

/* ── COLOR PICKER FLOTANTE ── */
.color-popover{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%) scale(.9);
  background:var(--white);border-radius:16px;box-shadow:0 12px 34px rgba(26,26,46,.2);
  padding:14px;display:none;z-index:996;gap:8px;flex-wrap:wrap;width:220px;
}
.color-popover.show{display:flex;}
.color-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid var(--border);}
</style>

<script>
/* ══════════════════════════════════════════════════════════════
   BOOKEO · EDITOR DE PÁGINAS
   Recibe la estructura del libro por WebSocket (según el backend la
   va calculando) y permite editar antes de generar el PDF final.
   ══════════════════════════════════════════════════════════════ */

const BACKEND_URL = 'https://bookeo-production.up.railway.app';
const WS_URL = BACKEND_URL.replace('https://', 'wss://').replace('http://', 'ws://') + '/ws/editor/';

const params = new URLSearchParams(location.search);
const pedidoId = params.get('pedido_id');

const MAX_PAGINAS_ESCRIBIBLES = 30;
const MG = 10, GAP = 3; // mm — deben coincidir con crear_libro_railway.py

let paginas = [];          // estructura completa (indice = numero de pagina)
let totalPaginas = 0;
let paginasRecibidas = 0;
let paginaActual = 0;
let libroAW = 200, libroAH = 200;   // mm, valor por defecto hasta que llegue "completo"
let libroTitulo = '', libroSubtitulo = '';
let cargaCompleta = false;
let cambiosSinGuardar = false;
let modoMover = false;
let paginaOrigenMover = null;
let canvas = null;
let ws = null;

// ── ARRANQUE ──
function iniciar() {
  if (!pedidoId) {
    document.getElementById('loadingText').textContent =
      'Falta el identificador del pedido en la URL (?pedido_id=...).';
    return;
  }
  inicializarCanvas();
  conectarWebSocket();
  vincularBotones();
  window.addEventListener('resize', ajustarTamanoCanvas);
}

// ── CANVAS FABRIC.JS ──
function inicializarCanvas() {
  canvas = new fabric.Canvas('fabricCanvas', { selection: false, preserveObjectStacking: true });
  canvas.on('mouse:down', (e) => {
    if (!e.target) ocultarBotonEliminar(); // clic en zona vacía -> deselecciona
  });
  ajustarTamanoCanvas();
}

function ajustarTamanoCanvas() {
  if (!canvas) return;
  const areaEl = document.getElementById('canvasArea');
  const maxW = Math.max(160, areaEl.clientWidth - 36);
  const maxH = Math.max(160, areaEl.clientHeight - 36);
  const ratio = libroAW / libroAH;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.setWidth(w);
  canvas.setHeight(h);
  canvas.calcOffset();
  if (paginas[paginaActual]) mostrarPagina(paginaActual);
}

// ── WEBSOCKET ──
function conectarWebSocket() {
  ws = new WebSocket(WS_URL + pedidoId);

  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }

    if (msg.tipo === 'pagina') {
      paginas[msg.indice] = msg.pagina;
      totalPaginas = msg.total_paginas;
      paginasRecibidas++;
      actualizarThumb(msg.indice, msg.pagina);
      document.getElementById('loadingText').textContent =
        `Cargando páginas... ${paginasRecibidas}/${msg.total_paginas}`;

      if (msg.indice === 0) {
        document.getElementById('loadingOverlay').classList.add('hide');
        paginaActual = 0;
      }
      if (paginaActual === msg.indice) {
        mostrarPagina(paginaActual);
      }
      actualizarIndicador();

    } else if (msg.tipo === 'completo') {
      libroAW = msg.AW || libroAW;
      libroAH = msg.AH || libroAH;
      libroTitulo = msg.titulo || '';
      libroSubtitulo = msg.subtitulo || '';
      totalPaginas = msg.total_paginas;
      cargaCompleta = true;
      document.getElementById('loadingOverlay').classList.add('hide');
      ajustarTamanoCanvas();
      mostrarPagina(paginaActual);
      actualizarIndicador();
      toast('✅ Tu libro está cargado, ya puedes editarlo');

    } else if (msg.tipo === 'error') {
      document.getElementById('loadingText').textContent = '⚠️ ' + msg.error;
      toast('⚠️ ' + msg.error);
    }
  };

  ws.onerror = () => {
    toast('⚠️ Error de conexión. Comprueba tu internet.');
  };
}

// ── RENDER DE UNA PÁGINA ──
function mostrarPagina(indice) {
  if (!canvas) return;
  const pagina = paginas[indice];
  paginaActual = indice;
  canvas.clear();
  canvas.backgroundColor = '#ffffff';
  ocultarBotonEliminar();

  const hint = document.getElementById('pageHint');
  hint.style.display = 'none';

  if (!pagina) {
    canvas.backgroundColor = '#f4faf6';
    canvas.renderAll();
    actualizarIndicador();
    resaltarThumbActivo();
    return;
  }

  const pxPorMM = canvas.getWidth() / libroAW;

  switch (pagina.tipo) {
    case 'portada':
      renderFotoCompleta(pagina.fotos[0], pxPorMM);
      hint.textContent = '📖 Portada (edítala en el editor de portada)';
      hint.style.display = 'block';
      break;
    case 'blanco':
      canvas.backgroundColor = '#fdfdfb';
      hint.textContent = '⬜ Página en blanco — no se puede escribir aquí';
      hint.style.display = 'block';
      break;
    case 'titulo_capitulo':
      renderTituloCapitulo(pagina, pxPorMM);
      break;
    case 'contenido':
      renderContenido(pagina, pxPorMM);
      break;
    case 'lomo':
      canvas.backgroundColor = '#f0faf5';
      hint.textContent = '📚 Lomo (usa el mismo color y letra que tu portada)';
      hint.style.display = 'block';
      break;
    case 'contraportada':
      canvas.backgroundColor = '#ffffff';
      hint.textContent = '📖 Contraportada';
      hint.style.display = 'block';
      break;
  }

  canvas.renderAll();
  actualizarIndicador();
  resaltarThumbActivo();
}

function renderFotoCompleta(foto, pxPorMM) {
  if (!foto || !foto.url) return;
  fabric.Image.fromURL(foto.url, (img) => {
    ajustarImagenAZona(img, 0, 0, canvas.getWidth(), canvas.getHeight());
    img.selectable = false;
    canvas.add(img);
    canvas.renderAll();
  });
}

function renderTituloCapitulo(pagina, pxPorMM) {
  const cap = pagina.capitulo || {};
  (pagina.fotos || []).slice(0, 1).forEach((foto) => {
    if (!foto.url) return;
    fabric.Image.fromURL(foto.url, (img) => {
      ajustarImagenAZona(img, 0, 0, canvas.getWidth(), canvas.getHeight() * 0.62);
      img.selectable = false;
      canvas.add(img);
      canvas.renderAll();
    });
  });
  const titulo = new fabric.Textbox(cap.titulo || 'Capítulo', {
    left: canvas.getWidth() * 0.5, top: canvas.getHeight() * 0.72,
    originX: 'center', fontFamily: "'Lora', serif", fontSize: canvas.getWidth() * 0.06,
    fontWeight: '700', fill: '#1a1a2e', textAlign: 'center', selectable: true,
    width: canvas.getWidth() * 0.86,
  });
  const subtitulo = new fabric.Textbox(cap.subtitulo || '', {
    left: canvas.getWidth() * 0.5, top: canvas.getHeight() * 0.72 + canvas.getWidth() * 0.08,
    originX: 'center', fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: canvas.getWidth() * 0.032,
    fill: '#7a7a8a', textAlign: 'center', selectable: true, width: canvas.getWidth() * 0.86,
  });
  canvas.add(titulo, subtitulo);
  titulo.__campoTexto = 'capitulo_titulo';
  subtitulo.__campoTexto = 'capitulo_subtitulo';
  canvas.renderAll();
}

function renderContenido(pagina, pxPorMM) {
  const fotos = pagina.fotos || [];
  const zonas = calcularZonasLayout(pagina.layout, fotos.length, pxPorMM);
  zonas.forEach((zona, i) => {
    const foto = fotos[i];
    if (!foto || !foto.url) return;
    fabric.Image.fromURL(foto.url, (img) => {
      ajustarImagenAZona(img, zona.x, zona.y, zona.w, zona.h);
      img.selectable = false;
      img.hoverCursor = 'pointer';
      img.__indiceFoto = i;
      img.on('mousedown', () => seleccionarFotoParaCambiar(i));
      canvas.add(img);

      // Si esta foto lleva el QR del vídeo, se pinta una insignia clicable
      // aparte, para poder quitar solo el vídeo sin borrar la foto.
      if (pagina.qr_idx === i && pagina.qr_url) {
        const badge = new fabric.Circle({
          left: zona.x + zona.w - 26, top: zona.y + 10,
          radius: 14, fill: '#1a1a2e', selectable: false, hoverCursor: 'pointer',
        });
        const icono = new fabric.Text('▶', {
          left: zona.x + zona.w - 26, top: zona.y + 10,
          fontSize: 12, fill: '#ffffff', originX: 'center', originY: 'center',
          selectable: false, hoverCursor: 'pointer',
        });
        icono.set({ left: badge.left + badge.radius, top: badge.top + badge.radius });
        badge.on('mousedown', () => seleccionarQR(i));
        icono.on('mousedown', () => seleccionarQR(i));
        canvas.add(badge, icono);
      }

      canvas.renderAll();
    });
  });

  if (pagina.texto) {
    const pie = new fabric.Textbox(pagina.texto, {
      left: canvas.getWidth() / 2, top: canvas.getHeight() - MG * pxPorMM * 0.6,
      originX: 'center', originY: 'center', fontFamily: "'Plus Jakarta Sans', sans-serif",
      fontSize: canvas.getWidth() * 0.028, fill: '#2e2e3a', textAlign: 'center',
      width: canvas.getWidth() * 0.8, selectable: true,
    });
    pie.__campoTexto = 'pie';
    canvas.add(pie);
  }
}

// Reproduce las mismas proporciones que layout_1/2H/2V/3/4 en crear_libro_railway.py
function calcularZonasLayout(layout, numFotos, pxPorMM) {
  const AWp = canvas.getWidth(), AHp = canvas.getHeight();
  const mg = MG * pxPorMM, gap = GAP * pxPorMM;

  if (layout === '1' || numFotos === 1) {
    return [{ x: 0, y: 0, w: AWp, h: AHp }];
  }
  if (layout === '2H') {
    const fw = (AWp - mg * 2 - gap) / 2, fh = AHp - mg * 2;
    return [0, 1].map(i => ({ x: mg + i * (fw + gap), y: mg, w: fw, h: fh }));
  }
  if (layout === '2V') {
    const fh = (AHp - mg * 2 - gap) / 2, fw = AWp - mg * 2;
    return [0, 1].map(i => ({ x: mg, y: mg + i * (fh + gap), w: fw, h: fh }));
  }
  if (layout === '3') {
    const pw = AWp * 0.60 - mg, sh = (AHp - mg * 2 - gap) / 2, sw = AWp - mg - pw - gap - mg;
    return [
      { x: mg, y: mg, w: pw, h: AHp - mg * 2 },
      { x: mg + pw + gap, y: mg, w: sw, h: sh },
      { x: mg + pw + gap, y: mg + sh + gap, w: sw, h: sh },
    ];
  }
  if (layout === '4') {
    const cw = (AWp - mg * 2 - gap) / 2, ch = (AHp - mg * 2 - gap) / 2;
    return [
      { x: mg, y: mg + ch + gap, w: cw, h: ch },
      { x: mg + cw + gap, y: mg + ch + gap, w: cw, h: ch },
      { x: mg, y: mg, w: cw, h: ch },
      { x: mg + cw + gap, y: mg, w: cw, h: ch },
    ];
  }
  // Fallback: reparte en fila
  const fw = AWp / Math.max(1, numFotos);
  return Array.from({ length: numFotos }, (_, i) => ({ x: i * fw, y: 0, w: fw, h: AHp }));
}

function ajustarImagenAZona(img, x, y, w, h) {
  // Recorte tipo "cover": llena la zona entera sin deformar (igual que foto_zona en el backend)
  const escala = Math.max(w / img.width, h / img.height);
  img.scale(escala);
  img.set({
    left: x + w / 2, top: y + h / 2, originX: 'center', originY: 'center',
  });
  const clipW = w / escala, clipH = h / escala;
  img.clipPath = new fabric.Rect({
    width: clipW, height: clipH, originX: 'center', originY: 'center',
  });
}

// ── PANEL DE MINIATURAS ──
function actualizarThumb(indice, pagina) {
  const grid = document.getElementById('thumbGrid');
  let thumb = document.getElementById('thumb-' + indice);
  if (!thumb) {
    thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.id = 'thumb-' + indice;
    thumb.onclick = () => { mostrarPagina(indice); cerrarPanel(); };
    // Insertar en orden
    const siguiente = grid.querySelector(`[data-indice="${indice + 1}"]`);
    if (siguiente) grid.insertBefore(thumb, siguiente); else grid.appendChild(thumb);
  }
  thumb.dataset.indice = indice;

  const fotoPreview = (pagina.fotos && pagina.fotos[0] && pagina.fotos[0].url) ? pagina.fotos[0].url : null;
  const etiquetas = {
    portada: 'Portada', blanco: 'Guarda', titulo_capitulo: (pagina.capitulo && pagina.capitulo.titulo) || 'Capítulo',
    contenido: 'Pág. ' + (indice + 1), lomo: 'Lomo', contraportada: 'Contra',
  };
  thumb.innerHTML = fotoPreview
    ? `<img src="${fotoPreview}" loading="lazy"><div class="thumb-label">${etiquetas[pagina.tipo] || ''}</div>`
    : `<div class="thumb-loading">${etiquetas[pagina.tipo] || '...'}</div>`;
}

function resaltarThumbActivo() {
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  const activo = document.getElementById('thumb-' + paginaActual);
  if (activo) activo.classList.add('active');
}

function abrirPanel() {
  document.getElementById('panel').classList.add('show');
  document.getElementById('panelOverlay').classList.add('show');
}
function cerrarPanel() {
  document.getElementById('panel').classList.remove('show');
  document.getElementById('panelOverlay').classList.remove('show');
}

// ── NAVEGACIÓN ──
function actualizarIndicador() {
  document.getElementById('pageIndicator').textContent =
    totalPaginas ? `${paginaActual + 1} / ${totalPaginas}` : '— / —';
  document.getElementById('btnAnterior').disabled = paginaActual <= 0;
  document.getElementById('btnSiguiente').disabled = paginaActual >= totalPaginas - 1;
}

function irAnterior() { if (paginaActual > 0) mostrarPagina(paginaActual - 1); }
function irSiguiente() { if (paginaActual < totalPaginas - 1) mostrarPagina(paginaActual + 1); }

function contarPaginasEscribibles() {
  return paginas.filter(p => p && p.tipo === 'contenido').length;
}

// ── AÑADIR 2 PÁGINAS ──
function anadirDosPaginas() {
  const actuales = contarPaginasEscribibles();
  if (actuales + 2 > MAX_PAGINAS_ESCRIBIBLES) {
    toast(`⚠️ Ya tienes ${actuales} páginas de contenido — el máximo son ${MAX_PAGINAS_ESCRIBIBLES}.`);
    return;
  }
  // Se insertan justo después de la página actual (o antes del lomo si estamos al final)
  let posInsercion = paginaActual + 1;
  const nuevaPagina = () => ({
    tipo: 'contenido', layout: '1', fotos: [], texto: '', qr_idx: -1, qr_url: '', capitulo: null,
  });
  paginas.splice(posInsercion, 0, nuevaPagina(), nuevaPagina());
  totalPaginas = paginas.length;
  cambiosSinGuardar = true;
  reindexarThumbs();
  mostrarPagina(posInsercion);
  toast('✅ 2 páginas añadidas — usa 📷 para poner tus fotos');
}

function reindexarThumbs() {
  const grid = document.getElementById('thumbGrid');
  grid.innerHTML = '';
  paginas.forEach((pagina, i) => { if (pagina) actualizarThumb(i, pagina); });
  resaltarThumbActivo();
  actualizarIndicador();
}

// ── MOVER PÁGINA ──
function activarMoverPagina() {
  if (!modoMover) {
    modoMover = true;
    paginaOrigenMover = paginaActual;
    document.getElementById('btnMover').classList.add('active');
    toast('↕ Elige en el panel de páginas dónde quieres moverla');
    abrirPanel();
  } else {
    modoMover = false;
    document.getElementById('btnMover').classList.remove('active');
  }
}

function moverPaginaA(destino) {
  if (!modoMover || paginaOrigenMover === null) return;
  const [pag] = paginas.splice(paginaOrigenMover, 1);
  paginas.splice(destino, 0, pag);
  modoMover = false;
  paginaOrigenMover = null;
  cambiosSinGuardar = true;
  document.getElementById('btnMover').classList.remove('active');
  totalPaginas = paginas.length;
  reindexarThumbs();
  mostrarPagina(destino);
  toast('✅ Página movida');
}

// ── CAMBIAR FOTO ──
let indiceFotoAEditar = null;
function seleccionarFotoParaCambiar(indice) {
  indiceFotoAEditar = indice;
  mostrarBotonEliminar('foto', indice);
}

// ── SELECCIÓN + ELIMINAR (foto o QR de vídeo) ──
let seleccionActual = null; // { tipo: 'foto' | 'qr', indice: n }

function mostrarBotonEliminar(tipo, indice) {
  seleccionActual = { tipo, indice };
  const btn = document.getElementById('btnEliminarSeleccion');
  document.getElementById('btnEliminarTexto').textContent = tipo === 'qr' ? 'Quitar vídeo' : 'Eliminar foto';
  btn.classList.add('show');

  const btnVer = document.getElementById('btnVerVideo');
  if (tipo === 'qr') btnVer.classList.add('show');
  else btnVer.classList.remove('show');
}

function ocultarBotonEliminar() {
  seleccionActual = null;
  const btn = document.getElementById('btnEliminarSeleccion');
  if (btn) btn.classList.remove('show');
  const btnVer = document.getElementById('btnVerVideo');
  if (btnVer) btnVer.classList.remove('show');
}

function seleccionarQR(indice) {
  mostrarBotonEliminar('qr', indice);
}

function verVideoSeleccionado() {
  const pagina = paginas[paginaActual];
  if (!pagina || !pagina.qr_url) {
    toast('⚠️ Esta página no tiene vídeo enlazado');
    return;
  }
  // El vídeo vive en Google Drive del cliente (mismo enlace del QR impreso).
  // Solo se puede ver aquí, en el editor - nunca se imprime.
  window.open(pagina.qr_url, '_blank');
}

async function eliminarSeleccionActual() {
  if (!seleccionActual) return;
  const pagina = paginas[paginaActual];
  if (!pagina) return;
  const { tipo, indice } = seleccionActual;

  if (tipo === 'foto') {
    const ok = await bkConfirm('¿Quieres eliminar esta foto de la página? No se puede deshacer.');
    if (!ok) return;
    pagina.fotos.splice(indice, 1);
    if (pagina.qr_idx === indice) { pagina.qr_idx = -1; pagina.qr_url = ''; }
    else if (pagina.qr_idx > indice) { pagina.qr_idx -= 1; }
    toast('🗑️ Foto eliminada');
  } else if (tipo === 'qr') {
    const ok = await bkConfirm('¿Quieres quitar el vídeo de esta foto? La foto se queda, solo se quita el enlace al vídeo (QR).');
    if (!ok) return;
    pagina.qr_idx = -1;
    pagina.qr_url = '';
    toast('🗑️ Vídeo desenlazado');
  }

  cambiosSinGuardar = true;
  ocultarBotonEliminar();
  mostrarPagina(paginaActual);
  actualizarThumb(paginaActual, pagina);
}

function pedirCambioFoto() {
  const pagina = paginas[paginaActual];
  if (!pagina || pagina.tipo !== 'contenido' || !pagina.fotos || !pagina.fotos.length) {
    toast('⚠️ Esta página no tiene foto para cambiar');
    return;
  }
  if (indiceFotoAEditar === null) indiceFotoAEditar = 0;
  document.getElementById('inputFotoPicker').click();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('inputFotoPicker').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const pagina = paginas[paginaActual];
      if (!pagina.fotos[indiceFotoAEditar]) pagina.fotos[indiceFotoAEditar] = {};
      pagina.fotos[indiceFotoAEditar].url = ev.target.result;
      pagina.fotos[indiceFotoAEditar].nombre = 'editada_' + file.name;
      pagina.fotos[indiceFotoAEditar].__subida_local = true;
      cambiosSinGuardar = true;
      mostrarPagina(paginaActual);
      actualizarThumb(paginaActual, pagina);
      toast('✅ Foto actualizada');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });
});

// ── TEXTO ──
function editarTexto() {
  const pagina = paginas[paginaActual];
  if (!pagina) return;
  if (pagina.tipo === 'contenido') {
    const nuevo = prompt('Texto de esta página:', pagina.texto || '');
    if (nuevo !== null) { pagina.texto = nuevo; cambiosSinGuardar = true; mostrarPagina(paginaActual); }
  } else if (pagina.tipo === 'titulo_capitulo') {
    const cap = pagina.capitulo || (pagina.capitulo = {});
    const nuevoTitulo = prompt('Título del capítulo:', cap.titulo || '');
    if (nuevoTitulo === null) return;
    cap.titulo = nuevoTitulo;
    const nuevoSub = prompt('Subtítulo del capítulo:', cap.subtitulo || '');
    if (nuevoSub !== null) cap.subtitulo = nuevoSub;
    cambiosSinGuardar = true;
    mostrarPagina(paginaActual);
    actualizarThumb(paginaActual, pagina);
  } else {
    toast('✏️ Esta página no tiene texto editable');
  }
}

// ── VÍDEO (QR) ──
function gestionarVideo() {
  const pagina = paginas[paginaActual];
  if (!pagina) return;
  if (pagina.qr_url) {
    verVideoSeleccionado();
  } else {
    toast('🎬 Añade vídeos desde "Reducir / Unir vídeo" antes de generar el libro');
  }
}

// ── FONDO (portada / lomo) ──
function abrirColorFondo() {
  const pagina = paginas[paginaActual];
  if (!pagina || (pagina.tipo !== 'portada' && pagina.tipo !== 'lomo')) {
    toast('🎨 El color de fondo solo se puede cambiar en la portada (se aplica también al lomo)');
    return;
  }
  document.getElementById('colorPopover').classList.toggle('show');
}

function aplicarColorFondo(hex) {
  canvas.backgroundColor = hex;
  canvas.renderAll();
  cambiosSinGuardar = true;
  document.getElementById('colorPopover').classList.remove('show');
  toast('🎨 Color aplicado a portada y lomo');
  // Nota: el color real de portada/lomo se gestiona en el editor de portada
  // (Fabric.js con color_fondo). Aquí solo se previsualiza.
}

// ── GUARDAR ──
function serializarPaginaActualDesdeCanvas() {
  const pagina = paginas[paginaActual];
  if (!pagina) return;
  canvas.getObjects().forEach((obj) => {
    if (obj.__campoTexto === 'pie') pagina.texto = obj.text;
    if (obj.__campoTexto === 'capitulo_titulo' && pagina.capitulo) pagina.capitulo.titulo = obj.text;
    if (obj.__campoTexto === 'capitulo_subtitulo' && pagina.capitulo) pagina.capitulo.subtitulo = obj.text;
  });
}

async function guardarYFinalizar() {
  if (!cargaCompleta) {
    toast('⏳ Espera a que termine de cargar el libro');
    return;
  }
  serializarPaginaActualDesdeCanvas();

  const confirmar = await bkConfirm(
    '¿Todo listo? Vamos a generar el PDF final de tu libro con los cambios que has hecho.'
  );
  if (!confirmar) return;

  const paginasParaEnviar = paginas.map((p) => {
    const copia = JSON.parse(JSON.stringify(p));
    (copia.fotos || []).forEach((f) => { delete f.url; }); // el backend solo necesita nombre/ruta
    return copia;
  });

  const formData = new FormData();
  formData.append('pedido_id', pedidoId);
  formData.append('estructura_editada_json', JSON.stringify(paginasParaEnviar));

  mostrarPantallaGenerando('Guardando los cambios de tu libro...');

  try {
    const resp = await fetch(BACKEND_URL + '/crear-pedido/finalizar', { method: 'POST', body: formData });
    if (!resp.ok) throw new Error('Error del servidor');
    const data = await resp.json();
    cambiosSinGuardar = false;
    await esperarPdfListo(data.tarea_id);
  } catch (e) {
    ocultarPantallaGenerando();
    toast('⚠️ No se pudo guardar. Inténtalo de nuevo.');
  }
}

function mostrarPantallaGenerando(mensaje) {
  const overlay = document.getElementById('loadingOverlay');
  document.getElementById('loadingText').textContent = mensaje;
  overlay.classList.remove('hide');
}
function ocultarPantallaGenerando() {
  document.getElementById('loadingOverlay').classList.add('hide');
}

async function esperarPdfListo(tareaId) {
  const mensajes = [
    'Componiendo tu libro...', 'Colocando cada foto en su sitio...',
    'Preparando el PDF de impresión...', 'Ya casi está...',
  ];
  let intento = 0;

  while (true) {
    document.getElementById('loadingText').textContent = mensajes[intento % mensajes.length];
    intento++;

    let data;
    try {
      const resp = await fetch(BACKEND_URL + '/estado-tarea/' + tareaId);
      data = await resp.json();
    } catch (e) {
      await sleep(2500);
      continue;
    }

    if (data.estado === 'listo' && data.pdf_url) {
      ocultarPantallaGenerando();
      irAPago(tareaId, data.pdf_url);
      return;
    }
    if (data.estado === 'error') {
      ocultarPantallaGenerando();
      toast('⚠️ Hubo un problema generando tu PDF. Inténtalo de nuevo.');
      return;
    }
    await sleep(2500);
  }
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function irAPago(tareaId, pdfUrl) {
  const portadaFoto = (paginas[0] && paginas[0].fotos && paginas[0].fotos[0]) ? paginas[0].fotos[0].url : '';
  const qp = new URLSearchParams({
    pedido_id: pedidoId,
    pdf_url: pdfUrl,
    titulo: libroTitulo || '',
    aw: libroAW, ah: libroAH,
    portada: portadaFoto || '',
  });
  window.location.href = 'pago.html?' + qp.toString();
}

// ── UI: TOAST + MODAL CONFIRM ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimeout);
  window.__toastTimeout = setTimeout(() => t.classList.remove('show'), 3200);
}

function bkConfirm(mensaje) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('bkModalOverlay');
    document.getElementById('bkModalMsg').textContent = mensaje;
    overlay.classList.add('show');
    const btnCancelar = document.getElementById('bkModalCancelar');
    const btnAceptar = document.getElementById('bkModalAceptar');
    function cerrar(resultado) {
      overlay.classList.remove('show');
      btnCancelar.removeEventListener('click', onCancelar);
      btnAceptar.removeEventListener('click', onAceptar);
      resolve(resultado);
    }
    function onCancelar() { cerrar(false); }
    function onAceptar() { cerrar(true); }
    btnCancelar.addEventListener('click', onCancelar);
    btnAceptar.addEventListener('click', onAceptar);
  });
}

// ── AVISO ANTES DE SALIR (cerrar pestaña, recargar, o botón atrás del móvil) ──
// Aviso nativo del navegador al cerrar pestaña o recargar (Chrome no deja
// personalizar el texto, pero el aviso sale igual con cambios sin guardar)
window.addEventListener('beforeunload', (e) => {
  if (!cambiosSinGuardar) return;
  e.preventDefault();
  e.returnValue = '';
  return '';
});

// Trampa específica para el botón "atrás" del móvil: metemos una entrada
// extra en el historial. Si el cliente pulsa atrás con cambios sin guardar,
// interceptamos y preguntamos con NUESTRO modal (más claro que el nativo);
// si confirma que quiere salir, le dejamos ir de verdad.
history.pushState({ bookeoEditor: true }, '');
window.addEventListener('popstate', async () => {
  if (!cambiosSinGuardar) return; // sin cambios pendientes, se deja salir sin más
  history.pushState({ bookeoEditor: true }, ''); // atrapa la navegación mientras preguntamos
  const salir = await bkConfirm(
    'Tienes cambios sin guardar en tu libro. Si sales ahora, se perderán. ¿Seguro que quieres salir?'
  );
  if (salir) {
    cambiosSinGuardar = false;
    history.back();
  }
});

// ── VINCULAR BOTONES ──
function vincularBotones() {
  document.getElementById('btnAnterior').onclick = irAnterior;
  document.getElementById('btnSiguiente').onclick = irSiguiente;
  document.getElementById('btnMover').onclick = activarMoverPagina;
  document.getElementById('btnAnadir').onclick = anadirDosPaginas;
  document.getElementById('btnPaginas').onclick = abrirPanel;
  document.getElementById('panelClose').onclick = cerrarPanel;
  document.getElementById('panelOverlay').onclick = cerrarPanel;

  document.getElementById('btnFotos').onclick = pedirCambioFoto;
  document.getElementById('btnVideos').onclick = gestionarVideo;
  document.getElementById('btnTexto').onclick = editarTexto;
  document.getElementById('btnFondo').onclick = abrirColorFondo;
  document.getElementById('btnGuardar').onclick = guardarYFinalizar;
  document.getElementById('btnEliminarSeleccion').onclick = eliminarSeleccionActual;
  document.getElementById('btnVerVideo').onclick = verVideoSeleccionado;

  document.querySelectorAll('.color-swatch').forEach((sw) => {
    sw.onclick = () => aplicarColorFondo(sw.dataset.color);
  });
  document.getElementById('colorCustom').oninput = (e) => aplicarColorFondo(e.target.value);

  // Click en una miniatura mientras se está en "modo mover" -> mueve la página
  document.getElementById('thumbGrid').addEventListener('click', (e) => {
    if (!modoMover) return;
    const thumb = e.target.closest('.thumb');
    if (!thumb) return;
    e.stopPropagation();
    moverPaginaA(parseInt(thumb.dataset.indice, 10));
  }, true);
}

iniciar();
</script>
